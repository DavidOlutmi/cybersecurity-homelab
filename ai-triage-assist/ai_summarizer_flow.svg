<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI log summarizer — project flow</title>
  <desc>A Wazuh alert is pulled via the Wazuh API, formatted into a structured prompt alongside a system prompt, sent to a self-hosted Llama 3.1 8B model running on a dedicated VM via the Ollama API with low temperature, and the model returns a plain-language summary which is checked against the known facts of the case before being saved.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1C9A8F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#FFFFFF"/>

  <!-- Step 1: Wazuh -->
  <rect x="30" y="150" width="140" height="100" rx="12" fill="#FCF3E3" stroke="#BA7517" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7A4E0E">1. Wazuh</text>
  <text x="100" y="200" text-anchor="middle" font-size="10" fill="#7A4E0E">Real alert data</text>
  <text x="100" y="216" text-anchor="middle" font-size="10" fill="#7A4E0E">(Kerberoasting case)</text>
  <text x="100" y="234" text-anchor="middle" font-size="9.5" fill="#7A4E0E">pulled via API</text>

  <line x1="170" y1="200" x2="215" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Python script -->
  <rect x="215" y="150" width="150" height="100" rx="12" fill="#E4F6F4" stroke="#1C9A8F" stroke-width="1.5"/>
  <text x="290" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F5E56">2. Python script</text>
  <text x="290" y="198" text-anchor="middle" font-size="10" fill="#0F5E56">Formats raw alert</text>
  <text x="290" y="214" text-anchor="middle" font-size="10" fill="#0F5E56">into a structured</text>
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#0F5E56">prompt</text>

  <line x1="365" y1="200" x2="410" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- System prompt box, feeding in from above -->
  <rect x="230" y="40" width="180" height="70" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="320" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#495057">System prompt</text>
  <text x="320" y="82" text-anchor="middle" font-size="9.5" fill="#495057">"Summarize factually,</text>
  <text x="320" y="96" text-anchor="middle" font-size="9.5" fill="#495057">3–4 sentences, no speculation"</text>
  <line x1="320" y1="110" x2="320" y2="150" stroke="#868E96" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Step 3: Ollama / LLM VM -->
  <rect x="410" y="150" width="170" height="100" rx="12" fill="#EDE7F6" stroke="#6A4C93" stroke-width="1.5"/>
  <text x="495" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3F2A5C">3. Ollama</text>
  <text x="495" y="194" text-anchor="middle" font-size="10" fill="#3F2A5C">Llama 3.1 8B</text>
  <text x="495" y="210" text-anchor="middle" font-size="10" fill="#3F2A5C">dedicated VM, temp 0.1–0.3</text>
  <text x="495" y="228" text-anchor="middle" font-size="9.5" fill="#3F2A5C">local API call</text>

  <line x1="580" y1="200" x2="625" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Summary output -->
  <rect x="625" y="150" width="160" height="100" rx="12" fill="#E4F6F4" stroke="#1C9A8F" stroke-width="1.5"/>
  <text x="705" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F5E56">4. Summary</text>
  <text x="705" y="198" text-anchor="middle" font-size="10" fill="#0F5E56">Plain-language</text>
  <text x="705" y="214" text-anchor="middle" font-size="10" fill="#0F5E56">draft returned</text>
  <text x="705" y="230" text-anchor="middle" font-size="9.5" fill="#0F5E56">to the script</text>

  <line x1="705" y1="250" x2="705" y2="290" stroke="#1C9A8F" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- Step 5: Human check -->
  <rect x="595" y="290" width="220" height="90" rx="12" fill="#FBEAEA" stroke="#C23B3B" stroke-width="1.5"/>
  <text x="705" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8C1F1F">5. You check it</text>
  <text x="705" y="336" text-anchor="middle" font-size="10" fill="#8C1F1F">Compare against what</text>
  <text x="705" y="352" text-anchor="middle" font-size="10" fill="#8C1F1F">actually happened —</text>
  <text x="705" y="368" text-anchor="middle" font-size="9.5" fill="#8C1F1F">note anything wrong or vague</text>

  <!-- Footer note -->
  <text x="410" y="410" text-anchor="middle" font-size="10.5" fill="#868E96">The model drafts. You verify. Human judgment is the last step, not skipped.</text>
</svg>
