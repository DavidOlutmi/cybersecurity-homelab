<svg width="740" height="520" viewBox="0 0 740 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>Homelab network diagram — pfSense edge, Active Directory domain, Ubuntu Wazuh SIEM</title>
  <desc>pfSense as the network edge performing NAT to the internet, LAN at 192.168.56.1. Inside the internal LAN sits a Windows Server 2019 domain controller at 192.168.56.40 running AD DS, DNS, and DHCP for the mydomain.com domain, populated with 1,000+ users across six department organizational units with matching security groups, plus three seeded service accounts. A domain-joined Windows 10 client and a Kali attacker machine sit alongside it, with Kerberoasting, AS-REP roasting, and password spray tooling staged and ready. An Ubuntu server running Wazuh SIEM ingests logs from all hosts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="740" height="520" fill="#FFFFFF"/>

  <!-- Internet -->
  <rect x="300" y="24" width="140" height="46" rx="8" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1"/>
  <text x="370" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">Internet / WAN</text>
  <text x="370" y="58" text-anchor="middle" font-size="10.5" fill="#868E96">Home router (DHCP)</text>
  <line x1="370" y1="70" x2="370" y2="94" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- pfSense -->
  <rect x="265" y="94" width="210" height="54" rx="8" fill="#FDECEA" stroke="#E5533D" stroke-width="1"/>
  <text x="370" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#B0330A">pfSense firewall (edge)</text>
  <text x="370" y="131" text-anchor="middle" font-size="10.5" fill="#B0330A">LAN: 192.168.56.1 · Gateway, NAT, VPN</text>
  <line x1="370" y1="148" x2="370" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internal LAN container -->
  <rect x="50" y="178" width="640" height="298" rx="20" fill="#EAF2FB" stroke="#4C7EBF" stroke-width="1"/>
  <text x="74" y="204" font-size="13.5" font-weight="700" fill="#1F4E8C">Internal LAN — 192.168.56.0/24 (isolated)</text>

  <!-- Domain Controller -->
  <rect x="70" y="224" width="220" height="132" rx="12" fill="#E4F6F4" stroke="#1C9A8F" stroke-width="1"/>
  <text x="180" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#0F5E56">Domain Controller</text>
  <text x="180" y="266" text-anchor="middle" font-size="10.5" fill="#0F5E56">Server 2019 · mydomain.com</text>
  <text x="180" y="282" text-anchor="middle" font-size="10.5" fill="#0F5E56">AD DS, DNS, DHCP scope</text>
  <text x="180" y="298" text-anchor="middle" font-size="10.5" fill="#0F5E56">1,000+ users · 6 dept. OUs</text>
  <text x="180" y="314" text-anchor="middle" font-size="10.5" fill="#0F5E56">+ security groups + 3 svc accounts</text>
  <text x="180" y="330" text-anchor="middle" font-size="10.5" fill="#0F5E56">192.168.56.40 (static)</text>
  <text x="180" y="346" text-anchor="middle" font-size="10.5" fill="#0F5E56">Wazuh agent active</text>

  <!-- Windows client -->
  <rect x="304" y="224" width="150" height="132" rx="12" fill="#E4F6F4" stroke="#1C9A8F" stroke-width="1"/>
  <text x="379" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#0F5E56">Windows 10 Client</text>
  <text x="379" y="266" text-anchor="middle" font-size="10.5" fill="#0F5E56">Domain-joined</text>
  <text x="379" y="282" text-anchor="middle" font-size="10.5" fill="#0F5E56">DHCP: 192.168.56.100–200</text>
  <text x="379" y="298" text-anchor="middle" font-size="10.5" fill="#0F5E56">DNS: 192.168.56.40</text>
  <text x="379" y="318" text-anchor="middle" font-size="10.5" fill="#0F5E56">Sysmon — next</text>

  <!-- Kali -->
  <rect x="472" y="224" width="180" height="132" rx="12" fill="#FBEAEA" stroke="#C23B3B" stroke-width="1"/>
  <text x="562" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#8C1F1F">Kali Attacker</text>
  <text x="562" y="266" text-anchor="middle" font-size="10.5" fill="#8C1F1F">192.168.56.10</text>
  <text x="562" y="282" text-anchor="middle" font-size="10.5" fill="#8C1F1F">Kerberoasting</text>
  <text x="562" y="298" text-anchor="middle" font-size="10.5" fill="#8C1F1F">AS-REP roasting</text>
  <text x="562" y="314" text-anchor="middle" font-size="10.5" fill="#8C1F1F">Password spray tooling</text>
  <text x="562" y="334" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8C1F1F">staged and ready</text>

  <!-- Wazuh host -->
  <rect x="180" y="380" width="380" height="80" rx="12" fill="#FCF3E3" stroke="#BA7517" stroke-width="1"/>
  <text x="370" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#7A4E0E">Ubuntu Server — Wazuh SIEM</text>
  <text x="370" y="422" text-anchor="middle" font-size="10.5" fill="#7A4E0E">192.168.56.20 · Manager, indexer, dashboard</text>
  <text x="370" y="438" text-anchor="middle" font-size="10.5" fill="#7A4E0E">Ingests DC, client, and network logs</text>

  <!-- connectors -->
  <line x1="180" y1="356" x2="270" y2="388" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="379" y1="356" x2="365" y2="378" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="562" y1="356" x2="470" y2="388" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- Footer -->
  <text x="370" y="500" text-anchor="middle" font-size="10.5" fill="#868E96">David Olutimi — Homelab: pfSense edge · Active Directory (mydomain.com) · Wazuh SIEM</text>
</svg>
